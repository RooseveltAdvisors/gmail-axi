name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gpu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - name: Install stable copy
        shell: bash
        run: |
          set -euo pipefail
          install_root="$HOME/.local/lib/gmail-axi"
          previous="$HOME/.local/lib/gmail-axi.prev"
          staging="$HOME/.local/lib/gmail-axi.next"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R dist package.json README.md LICENSE accounts.example.toml skills "$staging"/
          if [[ "$(head -n1 "$staging/dist/cli.js")" != '#!/usr/bin/env node' ]]; then
            sed -i '1i#!/usr/bin/env node' "$staging/dist/cli.js"
          fi
          chmod +x "$staging/dist/cli.js"
          rm -rf "$previous"
          if [[ -d "$install_root" ]]; then cp -R "$install_root" "$previous"; fi
          rm -rf "$install_root"
          mv "$staging" "$install_root"
          mkdir -p "$HOME/.local/bin"
          # The launcher only execs the CLI. Credentials resolve from the vault
          # references in accounts.toml at invocation; sourcing a credential file
          # here is what this wrapper exists to never do again.
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'exec "$HOME/.local/lib/gmail-axi/dist/cli.js" "$@"' > "$HOME/.local/bin/gmail-axi"
          chmod +x "$HOME/.local/bin/gmail-axi"
      - name: Verify installed CLI
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          previous="$HOME/.local/lib/gmail-axi.prev"
          install_root="$HOME/.local/lib/gmail-axi"
          rollback() {
            status=$?
            trap - EXIT
            if [[ -d "$previous" ]]; then
              rm -rf "$install_root"
              mv "$previous" "$install_root"
              "$HOME/.local/bin/gmail-axi" --help || true
            fi
            exit "$status"
          }
          trap rollback EXIT
          "$HOME/.local/bin/gmail-axi" --help
          gmail-axi accounts
          gmail-axi doctor --json > /dev/null
          # The launcher must never reintroduce a credential file. Credentials
          # come from the vault references in accounts.toml (or an explicit env
          # override); a sourced .env is the regression this guards against.
          if grep -Eq '(^|[^[:alnum:]_])(source|\.)[[:space:]]' "$HOME/.local/bin/gmail-axi"; then
            echo "The installed launcher sources a file; credentials must resolve from the vault" >&2
            exit 1
          fi
          if grep -q 'credentials.env' "$HOME/.local/bin/gmail-axi"; then
            echo "The installed launcher still references credentials.env" >&2
            exit 1
          fi
          trap - EXIT
